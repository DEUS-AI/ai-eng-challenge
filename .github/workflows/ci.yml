name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit and API tests
        run: uv run pytest tests/ --ignore=tests/test_e2e.py -v

      - name: Verify graph compiles
        run: |
          uv run python -c "
          from src.database import init_db, seed_db
          conn = init_db(':memory:')
          seed_db(conn)
          from src.graph import build_graph
          graph = build_graph(db_conn=conn, api_key='fake-key')
          print(f'Graph OK: {list(graph.get_graph().nodes.keys())}')
          "
