[project]
name = "ai-customer-support"
version = "0.1.0"
description = "AI-powered multi-agent customer support system using LangGraph and Gemini"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4",
    "langchain-google-genai>=2.1",
    "langchain-core>=0.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
